name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release to promote to Homebrew (e.g. v1.0.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "No Xcode.app found in /Applications" >&2
            exit 1
          fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "${{ github.run_number }}"

      - name: Archive (universal)
        run: |
          xcodebuild \
            -project Flipio.xcodeproj \
            -scheme Flipio \
            -configuration Release \
            -archivePath build/Flipio.xcarchive \
            archive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_APP_SANDBOX=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Flipio.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --options=runtime \
            --entitlements App/Flipio.entitlements \
            --sign - build/export/Flipio.app
          codesign --verify --verbose=2 build/export/Flipio.app

      - name: Package DMG
        run: |
          mkdir -p build/dmg
          cp -R build/export/Flipio.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Flipio" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "Flipio-${VERSION}.dmg"
          shasum -a 256 "Flipio-${VERSION}.dmg" | tee SHA256SUMS
          {
            echo "### Release artifact"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Flipio-*.dmg
            SHA256SUMS
          generate_release_notes: true

  homebrew-update:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') && !contains(inputs.release_tag || github.ref_name, '-') }}
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Set HOMEBREW_TAP_TOKEN with Contents write access to pggolub/homebrew-flipio." >&2
            exit 1
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: pggolub/homebrew-flipio
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download published artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.0.5." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/flipio-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Flipio-${VERSION}.dmg" --dir "$RUNNER_TEMP/flipio-release" --clobber
          SHA256=$(shasum -a 256 "$RUNNER_TEMP/flipio-release/Flipio-${VERSION}.dmg" | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update cask version and checksum
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          ruby <<'RUBY'
          path = "tap/Casks/flipio.rb"
          content = File.read(path)
          { "version" => ENV.fetch("VERSION"), "sha256" => ENV.fetch("SHA256") }.each do |key, value|
            pattern = /^(\s*#{key}\s+)"[^"]+"/
            abort "Expected exactly one #{key} stanza" unless content.scan(pattern).length == 1
            content = content.sub(pattern) { "#{$1}\"#{value}\"" }
          end
          File.write(path, content)
          RUBY

      - name: Validate cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          TAP_PARENT="$(brew --repository)/Library/Taps/pggolub"
          mkdir -p "$TAP_PARENT"
          ln -s "$GITHUB_WORKSPACE/tap" "$TAP_PARENT/homebrew-flipio"
          brew style --fix --cask pggolub/flipio/flipio
          brew audit --cask --online pggolub/flipio/flipio

      - name: Publish Homebrew update
        working-directory: tap
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          git add Casks/flipio.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Flipio to ${VERSION}"
          git push origin HEAD:main
