name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release to promote to Homebrew (e.g. v1.0.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "No Xcode.app found in /Applications" >&2
            exit 1
          fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "${{ github.run_number }}"

      - name: Archive (universal)
        run: |
          xcodebuild \
            -project Flipio.xcodeproj \
            -scheme Flipio \
            -configuration Release \
            -archivePath build/Flipio.xcarchive \
            archive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_APP_SANDBOX=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Export archive
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Flipio.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Ad-hoc codesign
        run: |
          APP=build/export/Flipio.app
          SPK="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          # Sign Sparkle's helpers inside-out WITHOUT the app's entitlements
          # (they must not inherit the app sandbox), then the app itself.
          for item in \
            "$SPK/XPCServices/Installer.xpc" \
            "$SPK/XPCServices/Downloader.xpc" \
            "$SPK/Autoupdate" \
            "$SPK/Updater.app" \
            "$APP/Contents/Frameworks/Sparkle.framework"; do
            codesign --force --options=runtime --sign - "$item"
          done
          codesign --force --options=runtime \
            --entitlements App/Flipio.entitlements \
            --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Sparkle's updater tool must not be sandboxed or it cannot replace the app.
          if codesign -d --entitlements - "$SPK/Autoupdate" 2>&1 | grep -q "app-sandbox"; then
            echo "Autoupdate must not carry the app-sandbox entitlement" >&2
            exit 1
          fi
          codesign -d --entitlements - "$APP" 2>&1 | grep -q "network.client" \
            || { echo "App is missing network.client entitlement" >&2; exit 1; }

      - name: Package DMG
        run: |
          mkdir -p build/dmg
          cp -R build/export/Flipio.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Flipio" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "Flipio-${VERSION}.dmg"
          shasum -a 256 "Flipio-${VERSION}.dmg" | tee SHA256SUMS
          {
            echo "### Release artifact"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Sparkle appcast
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.10.1" # keep in sync with the SwiftPM pin
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "Set SPARKLE_ED_PRIVATE_KEY (output of Sparkle's generate_keys -x)." >&2
            exit 1
          fi
          if grep -q REPLACE_WITH_PUBLIC_KEY Config/Info.plist; then
            echo "Config/Info.plist still has the placeholder SUPublicEDKey." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJ -f "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          SIG=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "Flipio-${VERSION}.dmg")
          # SIG looks like: sparkle:edSignature="..." length="..."
          case "$SIG" in
            sparkle:edSignature=*) ;;
            *) echo "sign_update failed: $SIG" >&2; exit 1 ;;
          esac
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Flipio</title>
              <item>
                <title>Version ${VERSION}</title>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Flipio-${VERSION}.dmg"
                           type="application/octet-stream" ${SIG} />
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout appcast.xml
          cat appcast.xml

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Flipio-*.dmg
            SHA256SUMS
            appcast.xml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true

      - name: Publish release after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh cannot look up draft releases by tag, so find the id first.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          [ -n "$ID" ] || { echo "Draft release for $GITHUB_REF_NAME not found" >&2; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false

  homebrew-update:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') && !contains(inputs.release_tag || github.ref_name, '-') }}
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Set HOMEBREW_TAP_TOKEN with Contents write access to pggolub/homebrew-flipio." >&2
            exit 1
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: pggolub/homebrew-flipio
          ref: main
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download published artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.0.5." >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/flipio-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Flipio-${VERSION}.dmg" --dir "$RUNNER_TEMP/flipio-release" --clobber
          SHA256=$(shasum -a 256 "$RUNNER_TEMP/flipio-release/Flipio-${VERSION}.dmg" | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update cask version and checksum
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          ruby <<'RUBY'
          path = "tap/Casks/flipio.rb"
          content = File.read(path)
          { "version" => ENV.fetch("VERSION"), "sha256" => ENV.fetch("SHA256") }.each do |key, value|
            pattern = /^(\s*#{key}\s+)"[^"]+"/
            abort "Expected exactly one #{key} stanza" unless content.scan(pattern).length == 1
            content = content.sub(pattern) { "#{$1}\"#{value}\"" }
          end
          File.write(path, content)
          RUBY

      - name: Validate cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          TAP_PARENT="$(brew --repository)/Library/Taps/pggolub"
          mkdir -p "$TAP_PARENT"
          ln -s "$GITHUB_WORKSPACE/tap" "$TAP_PARENT/homebrew-flipio"
          brew style --fix --cask pggolub/flipio/flipio
          brew audit --cask --online pggolub/flipio/flipio

      - name: Publish Homebrew update
        working-directory: tap
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          git add Casks/flipio.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Flipio to ${VERSION}"
          git push origin HEAD:main
